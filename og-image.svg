<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="788" cy="651" r="26" fill="#047857" opacity="0.15"/>
    <circle cx="761" cy="596" r="21" fill="#047857" opacity="0.14"/>
    <circle cx="1162" cy="-81" r="83" fill="#047857" opacity="0.09"/>
    <circle cx="711" cy="281" r="86" fill="#047857" opacity="0.14"/>
    <circle cx="938" cy="613" r="96" fill="#047857" opacity="0.06"/>
    <circle cx="512" cy="141" r="85" fill="#047857" opacity="0.12"/>
    <rect x="211" y="513" width="66" height="28" rx="8" fill="#059669" opacity="0.09" transform="rotate(2, 884, 236)"/>
    <rect x="-14" y="204" width="46" height="78" rx="8" fill="#059669" opacity="0.05" transform="rotate(18, 1225, 165)"/>
    <rect x="22" y="617" width="29" height="64" rx="8" fill="#059669" opacity="0.08" transform="rotate(23, 427, 375)"/>
    <rect x="207" y="713" width="83" height="54" rx="8" fill="#059669" opacity="0.07" transform="rotate(35, 1044, 262)"/>
    <rect x="-24" y="407" width="39" height="99" rx="8" fill="#059669" opacity="0.12" transform="rotate(31, 178, 484)"/>
    <rect x="-41" y="313" width="67" height="77" rx="8" fill="#059669" opacity="0.05" transform="rotate(42, 464, 474)"/>
    <rect x="988" y="614" width="20" height="38" rx="8" fill="#059669" opacity="0.09" transform="rotate(20, 1022, 425)"/>
    <rect x="647" y="19" width="62" height="62" rx="8" fill="#059669" opacity="0.03" transform="rotate(21, 555, 580)"/>
    <polygon points="1231,66 1310,224 1152,224" fill="#047857" opacity="0.04"/>
    <polygon points="670,661 705,731 635,731" fill="#047857" opacity="0.06"/>
    <polygon points="717,180 755,256 679,256" fill="#047857" opacity="0.05"/>
    <polygon points="417,164 474,278 360,278" fill="#047857" opacity="0.03"/>

  <!-- Wave at bottom -->
  <path d="M0,542 C360,586 840,498 1200,542 L1200,630 L0,630Z" fill="#047857" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 럭셔리 단체 가라오케 예약 가이드
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — VIP 단체 모임
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#34d399" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     마포 럭셔리 단체 가라오케 예약 가이드 — VIP 단체 모임
  </text>
</svg>